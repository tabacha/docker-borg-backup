services:
  borg-admin:
    # Vorgebautes Image von GHCR - "docker compose pull" statt selbst
    # bauen. "build: ." bleibt als Fallback (z.B. für lokale Änderungen
    # am Dockerfile, oder falls die Registry nicht erreichbar ist).
    image: ghcr.io/tabacha/docker-borg-backup:latest
    build: .

    # Für "borg mount" (FUSE).
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

    # Kein Host-Quellverzeichnis hier: backup.sh mountet die in
    # BACKUP_SOURCE_DIRS konfigurierten Pfade dynamisch per zusätzlichem
    # "-v" beim "docker compose run" Aufruf (beliebig viele unabhängige
    # Verzeichnisbäume, compose.yml selbst kann keine dynamisch lange
    # Liste von Volumes deklarieren).
    volumes:
      - ./restore:/restore
      - ./secrets/${TARGET:?TARGET ist nicht gesetzt - Skripte immer mit Zielserver-Namen aufrufen, z.B. "backup.sh <target>", siehe README.md}/known_hosts:/root/.ssh/known_hosts:ro
      - ./secrets/${TARGET}/passphrase:/run/secrets/borg-passphrase:ro
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent-not-set}:/ssh-agent
      - borg-cache:/root/.cache/borg
      - borg-config:/root/.config/borg

    environment:
      SSH_AUTH_SOCK: /ssh-agent

      BORG_REPO: "ssh://${BORG_SSH_USER:?BORG_SSH_USER ist nicht gesetzt - siehe targets/<name>.env}@${BORG_SSH_HOST:?BORG_SSH_HOST ist nicht gesetzt - siehe targets/<name>.env}:${BORG_SSH_PORT:?BORG_SSH_PORT ist nicht gesetzt - siehe targets/<name>.env}/${BORG_REPO_PATH:?BORG_REPO_PATH ist nicht gesetzt - siehe targets/<name>.env}"
      BORG_REMOTE_PATH: "${BORG_REMOTE_PATH:?BORG_REMOTE_PATH ist nicht gesetzt - siehe targets/<name>.env}"
      BORG_RSH: >-
        ssh
        -p ${BORG_SSH_PORT}
        -o BatchMode=yes
        -o ServerAliveInterval=10
        -o ServerAliveCountMax=30

      BORG_PASSCOMMAND: "cat /run/secrets/borg-passphrase"

volumes:
  # Von allen Zielservern gemeinsam genutzt (nicht pro Zielserver) - Borg
  # legt darin Cache/Config-Daten je Repo-ID getrennt ab, ein gemeinsames
  # Volume für mehrere Repos ist ausdrücklich unterstützt.
  borg-cache:
    external: true
    name: docker-borg-backup_borg-cache

  borg-config:
    external: true
    name: docker-borg-backup_borg-config
