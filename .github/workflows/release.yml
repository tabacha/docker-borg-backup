name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Pre-Release-Tags (z.B. v1.1.0-rc1, Bindestrich per Semver-Konvention
          # für den Prerelease-Teil) bekommen NUR ihren exakten Versions-Tag -
          # weder "X.Y" noch "latest" werden dafür (um)gesetzt, sonst würde ein
          # Test-Tag den produktiven "latest"/"X.Y"-Tag überschreiben, den
          # "docker compose pull" standardmäßig zieht.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build (nur lokal, noch kein Push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Funktionstest (lokales Repo, FUSE-Mount) - erst danach wird gepusht
        # NICHT ":latest" - der wird bei einem Pre-Release-Tag (siehe oben)
        # gar nicht erst gesetzt/geladen, "version" zeigt immer aufs
        # tatsächlich gebaute Image.
        run: .github/scripts/functional-test.sh "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

      - name: Push (Cache vom Build-Schritt wird wiederverwendet, daher schnell)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Image: `ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}`
